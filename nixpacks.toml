[phases.setup]
nixPkgs = ["python312", "ffmpeg", "deno", "git"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "git clone --depth 1 --branch 2.0.0 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /opt/bgutil-ytdlp-pot-provider",
  "cd /opt/bgutil-ytdlp-pot-provider/server && deno install --allow-scripts=npm:canvas --frozen"
]

[start]
cmd = "./start.sh"
